apiVersion: apps/v1
kind: Deployment
metadata:
  name: beta-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beta-server
  template:
    metadata:
      labels:
        app: beta-server

    spec:
      containers:
        - name: beta-server
          image: ambassador-beta:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8091
---
apiVersion: v1
kind: Service
metadata:
  name: beta-server
spec:
  selector:
    app: beta-server
  ports:
    - name: http
      port: 8091
      targetPort: 8091
