apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          image: configserver:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--file=/app/config/config.json"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-source
              mountPath: /app/config
      volumes:
        - name: config-source
          configMap:
            name: app-config-source
---
apiVersion: v1
kind: Service
metadata:
  name: configserver
spec:
  selector:
    app: configserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
